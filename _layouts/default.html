  ---
  <!DOCTYPE html>
  <html lang="fr">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}Cyril Bray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814;
--ink-mid: #4a4640;
--ink-light: #8a857d;
--ink-faint: #c8c3bc;
  --paper: #f7f4ef;
  --paper-warm: #ede9e2;
  --gold: #b8975a;
  --gold-light: #d4b87a;
  --serif: 'Cormorant Garamond', Georgia, serif;
--sans: 'DM Sans', system-ui, sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.7; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 3rem; background: rgba(247, 244, 239, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--ink-faint); }
.nav-logo { font-family: var(--serif); font-weight: 300; font-size: 1.1rem; letter-spacing: 0.08em; color: var(--ink); text-decoration: none; }
.nav-links { display: flex; gap: 2.5rem; list-style: none; }
.nav-links a { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mid); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover { color: var(--gold); }
.nav-cta { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); text-decoration: none; border: 1px solid var(--ink); padding: 0.45rem 1.2rem; transition: background 0.25s, color 0.25s; }
.nav-cta:hover { background: var(--ink); color: var(--paper); }
main { padding-top: 6rem; min-height: 70vh; }
.container { max-width: 900px; margin: 0 auto; padding: 4rem 3rem 6rem; }
.blog-eyebrow { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
.blog-eyebrow::before { content: ''; width: 2rem; height: 1px; background: var(--gold); }
  .blog-title { font-family: var(--serif); font-weight: 300; font-size: clamp(2.2rem, 4vw, 3.2rem); line-height: 1.15; color: var(--ink); margin-bottom: 1rem; }
.blog-title em { font-style: italic; color: var(--gold); }
.blog-list { margin-top: 3rem; border-top: 1px solid var(--ink-faint); }
.post-item { display: block; padding: 2.5rem 0; border-bottom: 1px solid var(--ink-faint); text-decoration: none; color: inherit; }
.post-date { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.6rem; }
.post-title { font-family: var(--serif); font-size: 1.7rem; font-weight: 400; color: var(--ink); margin-bottom: 0.5rem; }
.post-excerpt { font-size: 0.9rem; color: var(--ink-mid); line-height: 1.7; max-width: 40rem; }
.article-date { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
.article-title { font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; color: var(--ink); margin-bottom: 2rem; }
.article-body { font-size: 1rem; color: var(--ink-mid); line-height: 1.85; max-width: 42rem; }
.article-body p { margin-bottom: 1.3rem; }
.article-body h2 { font-family: var(--serif); font-size: 1.8rem; font-weight: 400; color: var(--ink); margin: 2.5rem 0 1rem; }
.article-body h3 { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; color: var(--ink); margin: 2rem 0 0.75rem; }
.article-body a { color: var(--gold); }
.article-body blockquote { font-family: var(--serif); font-style: italic; font-size: 1.3rem; color: var(--ink); border-left: 2px solid var(--gold); padding-left: 1.5rem; margin: 2rem 0; }
.article-body ul, .article-body ol { margin: 0 0 1.3rem 1.3rem; }
.back-link { display: inline-block; margin-top: 1rem; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mid); text-decoration: none; border-bottom: 1px solid var(--ink-faint); padding-bottom: 2px; }
.back-link:hover { color: var(--gold); border-color: var(--gold); }
footer { background: #0f0e0c; padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: center; }
.footer-logo { font-family: var(--serif); font-size: 0.9rem; letter-spacing: 0.08em; color: rgba(240,235,227,0.4); }
.footer-copy { font-size: 0.65rem; letter-spacing: 0.1em; color: rgba(240,235,227,0.2); text-transform: uppercase; }
@media (max-width: 900px) {
nav { padding: 1rem 1.5rem; }
.nav-links { display: none; }
.container { padding: 3rem 1.5rem 4rem; }
footer { flex-direction: column; gap: 0.75rem; text-align: center; }
}
</style>
  </head>
  <body>
  <nav>
  <a href="/" class="nav-logo">Cyril Bray</a>
  <ul class="nav-links">
  <li><a href="/#about">About</a></li>
  <li><a href="/#expertise">Services</a></li>
  <li><a href="/#parcours">Career</a></li>
  <li><a href="/blog/">Blog</a></li>
  <li><a href="/#contact">Contact</a></li>
  </ul>
  <a href="/#contact" class="nav-cta">Get in touch</a>
  </nav>
  <main>
  <div class="container">
  {{ content }}
  </div>
  </main>
  <footer>
  <div class="footer-logo">Cyril Bray</div>
  <div class="footer-copy">CB Consulting &amp; Management © 2026 Cyril Bray · RCS Paris 104 466 586</div>
  </footer>
  </body>
  </html>

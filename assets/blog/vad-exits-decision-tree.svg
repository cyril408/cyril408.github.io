  <text x="48" y="590" font-size="11.5" fill="#4a4640">Full levies</text>
  <rect x="150" y="580" width="12" height="12" rx="3" fill="#f5ecd9" stroke="#b8975a" stroke-width="1.5"/>
  <text x="168" y="590" font-size="11.5" fill="#4a4640">Exit, transitional</text>
  <rect x="300" y="580" width="12" height="12" rx="3" fill="#e4eee0" stroke="#4f7a4a" stroke-width="1.5"/>
  <text x="318" y="590" font-size="11.5" fill="#4a4640">Exit, durable</text>

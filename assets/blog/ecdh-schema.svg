<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2733">EU Customs Data Hub &#8212; how data moves through the system</text>

  <!-- Traders box -->
  <rect x="30" y="70" width="220" height="120" rx="8" fill="#eef2f7" stroke="#5b6472" stroke-width="1.5"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2733">Traders</text>
  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#3a4250">Importers, exporters,</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#3a4250">online platforms</text>
  <text x="140" y="152" text-anchor="middle" font-size="10.5" fill="#5b6472">Submit product &amp; supply</text>
  <text x="140" y="167" text-anchor="middle" font-size="10.5" fill="#5b6472">chain data once, via one</text>
  <text x="140" y="182" text-anchor="middle" font-size="10.5" fill="#5b6472">single EU portal</text>

  <!-- Arrow traders -> hub -->
  <line x1="250" y1="130" x2="330" y2="130" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data Hub box (center) -->
  <rect x="330" y="60" width="240" height="180" rx="8" fill="#e4ecf7" stroke="#2f5fa3" stroke-width="2"/>
  <text x="450" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a63">EU Customs Data Hub</text>
  <text x="450" y="105" text-anchor="middle" font-size="10.5" fill="#2f4b73">Central data-driven engine</text>
  <text x="450" y="128" text-anchor="middle" font-size="10.5" fill="#3a4250">&#8226; AI / machine learning analysis</text>
  <text x="450" y="146" text-anchor="middle" font-size="10.5" fill="#3a4250">&#8226; 360&#176; view of supply chains</text>
  <text x="450" y="164" text-anchor="middle" font-size="10.5" fill="#3a4250">&#8226; One submission covers</text>
  <text x="450" y="180" text-anchor="middle" font-size="10.5" fill="#3a4250">&#160;&#160;multiple consignments</text>
  <text x="450" y="198" text-anchor="middle" font-size="10.5" fill="#3a4250">&#8226; Replaces 27 national IT systems</text>
  <text x="450" y="216" text-anchor="middle" font-size="10.5" fill="#3a4250">&#8226; Gradually, through 2034</text>

  <!-- Arrow hub -> authorities -->
  <line x1="570" y1="130" x2="650" y2="130" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Authorities box -->
  <rect x="650" y="70" width="220" height="120" rx="8" fill="#eef2f7" stroke="#5b6472" stroke-width="1.5"/>
  <text x="760" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2733">Customs authorities</text>
  <text x="760" y="115" text-anchor="middle" font-size="11" fill="#3a4250">EU Customs Authority</text>
  <text x="760" y="130" text-anchor="middle" font-size="11" fill="#3a4250">+ 27 Member States</text>
  <text x="760" y="152" text-anchor="middle" font-size="10.5" fill="#5b6472">Real-time, pooled data;</text>
  <text x="760" y="167" text-anchor="middle" font-size="10.5" fill="#5b6472">coordinated risk management</text>
  <text x="760" y="182" text-anchor="middle" font-size="10.5" fill="#5b6472">and checks</text>

  <!-- feedback arrow authorities -> hub (risk signals) -->
  <line x1="650" y1="160" x2="572" y2="160" stroke="#8a93a1" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Downstream: two pathways -->
  <line x1="450" y1="240" x2="450" y2="280" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="290" width="270" height="90" rx="8" fill="#e7f5ec" stroke="#2f8a52" stroke-width="1.5"/>
  <text x="365" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5c37">Trust &amp; Check traders</text>
  <text x="365" y="333" text-anchor="middle" font-size="10.5" fill="#2f4b3a">Verified, transparent supply chains</text>
  <text x="365" y="349" text-anchor="middle" font-size="10.5" fill="#2f4b3a">Goods released with no active</text>
  <text x="365" y="365" text-anchor="middle" font-size="10.5" fill="#2f4b3a">customs intervention</text>

  <rect x="530" y="290" width="270" height="90" rx="8" fill="#fbeeea" stroke="#b3532f" stroke-width="1.5"/>
  <text x="665" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3319">Standard declarants</text>
  <text x="665" y="333" text-anchor="middle" font-size="10.5" fill="#5c3423">Traditional customs declaration,</text>
  <text x="665" y="349" text-anchor="middle" font-size="10.5" fill="#5c3423">available in parallel until the</text>
  <text x="665" y="365" text-anchor="middle" font-size="10.5" fill="#5c3423">Hub becomes mandatory (2034)</text>

  <line x1="450" y1="240" x2="365" y2="290" stroke="#5b6472" stroke-width="1.2"/>
  <line x1="450" y1="240" x2="665" y2="290" stroke="#5b6472" stroke-width="1.2"/>

  <!-- Timeline -->
  <line x1="60" y1="450" x2="840" y2="450" stroke="#5b6472" stroke-width="1.5"/>
  <circle cx="150" cy="450" r="4.5" fill="#2f5fa3"/>
  <circle cx="420" cy="450" r="4.5" fill="#2f5fa3"/>
  <circle cx="690" cy="450" r="4.5" fill="#2f5fa3"/>

  <text x="150" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2733">2028</text>
  <text x="150" y="470" text-anchor="middle" font-size="10" fill="#3a4250">Hub opens for</text>
  <text x="150" y="483" text-anchor="middle" font-size="10" fill="#3a4250">e-commerce consignments</text>

  <text x="420" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2733">2031</text>
  <text x="420" y="470" text-anchor="middle" font-size="10" fill="#3a4250">Open, voluntary, to all</text>
  <text x="420" y="483" text-anchor="middle" font-size="10" fill="#3a4250">other importers</text>

  <text x="690" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2733">2034</text>
  <text x="690" y="470" text-anchor="middle" font-size="10" fill="#3a4250">Use of the Data Hub</text>
  <text x="690" y="483" text-anchor="middle" font-size="10" fill="#3a4250">becomes mandatory</text>

  <text x="450" y="520" text-anchor="middle" font-size="10.5" fill="#8a93a1">Source: European Commission, EU Customs Reform (taxation-customs.ec.europa.eu) &#8212; timeline as communicated, March&#8211;June 2026</text>
</svg>

